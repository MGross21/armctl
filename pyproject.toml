[build-system]
requires = ["uv_build>=0.5,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "armctl"
module-root = ""

[project]
name = "armctl"
version = "0.4.0"
description = "Agnostic Robotic Manipulation Controller (armctl)"
authors = [{ name = "Michael Gross", email = "MGross21@users.noreply.github.com" }]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
keywords = ["robotics", "socket", "control", "automation", "ur", "universal robotics", "jaka", "dobot", "elephant robotics", "vention", "fanuc"]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta"

]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "pyserial>=3.5",
    "typing-extensions>=4.4.0",
]

[project.optional-dependencies]
zaber = [
    "zaber-motion>=2.13.1",
]

[project.urls]
Homepage = "https://github.com/MGross21/armctl"
Issues = "https://github.com/MGross21/armctl/issues"

[project.scripts]
armctl = "armctl.__main__:main"

[dependency-groups]
format = [
    "ruff>=0.4.0;python_version>='3.11'",
]

test = [
    "pytest>=6.0.0",
    "pytest-cov>=3.0.0",
]

dev = [
    {include-group = "format"},
    {include-group = "test"}
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
target-version = "py39"
lint.select = ["E", "F", "W", "I", "B", "UP", "N", "C90"]
lint.ignore = [
    "N802",  # DOF property name
    "N813",  # cc alias for CommandCheck
    "N814",  # SCT/PLC aliases for controllers
    "N817",  # UR alias
    "B008",  # typer.Option/Argument defaults
]
lint.per-file-ignores = { "__init__.py" = ["F401", "F403", "E402"], "armctl/__main__.py" = ["UP006", "UP035", "UP045"] }
format.quote-style = "double"
format.indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["integration: requires Docker (URSim)"]

[tool.pyright]
pythonVersion = "3.9"
venvPath = "."
venv = ".venv"
reportImplicitOverride = "error"
